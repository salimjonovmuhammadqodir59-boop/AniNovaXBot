services:
  - type: web
    name: aninovax-bot
    env: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: aninovax-db
          property: connectionString
      - key: USE_WEBHOOK
        value: "true"
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_PATH
        value: /webhook
      - key: WEBAPP_HOST
        value: "0.0.0.0"
      - key: WEBAPP_PORT
        value: "10000"
      - key: PAYMENT_PROVIDER_TOKEN
        sync: false
      - key: PAYME_MERCHANT_ID
        sync: false
      - key: PAYME_SECRET_KEY
        sync: false
      - key: PAYME_TEST_MODE
        value: "true"
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_SECRET_KEY
        sync: false
      - key: CLICK_MERCHANT_USER_ID
        sync: false
      - key: UZUM_MERCHANT_ID
        sync: false
      - key: UZUM_SECRET_KEY
        sync: false
      - key: DEFAULT_LANGUAGE
        value: uz
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: aninovax-db
    plan: starter
    region: frankfurt
    databaseName: aninovax
    user: aninovax
