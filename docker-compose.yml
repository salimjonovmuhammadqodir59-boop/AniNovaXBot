version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aninovax
      POSTGRES_PASSWORD: aninovax
      POSTGRES_DB: aninovax
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aninovax"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aninovax:aninovax@db:5432/aninovax
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "10000:10000"
      - "10001:10001"

volumes:
  pgdata:
